[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

ignore = [
    "B008"  # FastAPI dependency injection pattern
]
[tool.coverage.run]
branch = true
source = ["core", "database", "models", "repositories", "routes", "schemas", "services"]

[tool.coverage.report]
fail_under = 85
show_missing = true
